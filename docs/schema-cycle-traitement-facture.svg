<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title desc">
  <title id="title">Cycle de traitement d'une facture d'achat</title>
  <desc id="desc">Processus allant de la réception à l'archivage, avec retour vers les contrôles lorsque les données ne sont pas conformes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .box-final { fill: #ecfdf5; stroke: #10b981; stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .box-correction { fill: #fff7ed; stroke: #f97316; stroke-width: 2.5; rx: 18; filter: url(#shadow); }
      .diamond { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.5; filter: url(#shadow); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #f97316; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#arrow); }
      .label { font-family: Calibri, Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #172033; text-anchor: middle; }
      .branch { font-family: Calibri, Arial, sans-serif; font-size: 19px; font-weight: 700; fill: #475569; }
      .step { font-family: Calibri, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #2563eb; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="440" fill="#ffffff"/>

  <path class="flow" d="M220 105 H258"/>
  <path class="flow" d="M448 105 H486"/>
  <path class="flow" d="M676 105 H714"/>
  <path class="flow" d="M904 105 H942"/>
  <path class="flow" d="M1132 105 H1170"/>

  <rect class="box" x="30" y="55" width="190" height="100"/>
  <text class="step" x="125" y="82">ÉTAPE 1</text>
  <text class="label" x="125" y="116"><tspan x="125">Réception de</tspan><tspan x="125" dy="25">la facture</tspan></text>

  <rect class="box" x="258" y="55" width="190" height="100"/>
  <text class="step" x="353" y="82">ÉTAPE 2</text>
  <text class="label" x="353" y="126">Identification</text>

  <rect class="box" x="486" y="55" width="190" height="100"/>
  <text class="step" x="581" y="82">ÉTAPE 3</text>
  <text class="label" x="581" y="116"><tspan x="581">Extraction des</tspan><tspan x="581" dy="25">informations</tspan></text>

  <rect class="box" x="714" y="55" width="190" height="100"/>
  <text class="step" x="809" y="82">ÉTAPE 4</text>
  <text class="label" x="809" y="116"><tspan x="809">Structuration</tspan><tspan x="809" dy="25">des données</tspan></text>

  <rect class="box" x="942" y="55" width="190" height="100"/>
  <text class="step" x="1037" y="82">ÉTAPE 5</text>
  <text class="label" x="1037" y="116"><tspan x="1037">Contrôles de</tspan><tspan x="1037" dy="25">conformité</tspan></text>

  <polygon class="diamond" points="1260,35 1350,105 1260,175 1170,105"/>
  <text class="label" x="1260" y="98"><tspan x="1260">Données</tspan><tspan x="1260" dy="25">conformes ?</tspan></text>

  <path class="flow" d="M1260 175 V282 H1164"/>
  <text class="branch" x="1275" y="224">Oui</text>

  <rect class="box" x="974" y="245" width="190" height="100"/>
  <text class="step" x="1069" y="272">ÉTAPE 6</text>
  <text class="label" x="1069" y="316">Imputation</text>

  <path class="flow" d="M974 295 H936"/>
  <rect class="box" x="726" y="245" width="210" height="100"/>
  <text class="step" x="831" y="272">ÉTAPE 7</text>
  <text class="label" x="831" y="306"><tspan x="831">Validation automatique</tspan><tspan x="831" dy="25">ou humaine</tspan></text>

  <path class="flow" d="M726 295 H688"/>
  <rect class="box" x="498" y="245" width="190" height="100"/>
  <text class="step" x="593" y="272">ÉTAPE 8</text>
  <text class="label" x="593" y="316">Comptabilisation</text>

  <path class="flow" d="M498 295 H460"/>
  <rect class="box-final" x="270" y="245" width="190" height="100"/>
  <text class="step" x="365" y="272" fill="#059669">ÉTAPE 9</text>
  <text class="label" x="365" y="316">Archivage</text>

  <path class="flow" d="M1350 105 H1380 V245"/>
  <text class="branch" x="1365" y="90">Non</text>
  <rect class="box-correction" x="1365" y="245" width="205" height="100"/>
  <text class="label" x="1467" y="306"><tspan x="1467">Correction ou</tspan><tspan x="1467" dy="25">complément</tspan></text>
  <path class="return" d="M1467 345 V400 H1037 V157"/>
</svg>
